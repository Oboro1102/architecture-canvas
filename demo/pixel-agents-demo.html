<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel Agent Demo — AI Company OS</title>
<style>
  :root {
    --bg: #141417;
    --card: #1d1d22;
    --border: #2c2c33;
    --fg: #e7e7ea;
    --muted: #9b9ba3;
    --accent: #8b7cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  /* 控制列：切換全體狀態 */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .controls button {
    background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .controls button:hover { border-color: var(--accent); }
  .controls button.active { border-color: var(--accent); color: var(--accent); }

  /* 辦公室平面圖 */
  .office {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .desk {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 10px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    position: relative;
  }
  .desk.working   { border-color: rgba(16,185,129,.45); box-shadow: 0 0 14px -6px rgba(16,185,129,.5); }
  .desk.blocked   { border-color: rgba(239,68,68,.5); }
  .desk.completed { border-color: rgba(20,184,166,.4); }
  .role  { font-size: 13px; font-weight: 600; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #ffffff12; color: var(--muted); }
  .desk.working   .badge { color: #34d399; }
  .desk.waiting   .badge { color: #fbbf24; }
  .desk.blocked   .badge { color: #f87171; }
  .desk.reviewing .badge { color: #34d399; }
  .desk.completed .badge { color: #2dd4bf; }

  /* ── 像素小人 ── */
  .stage { width: 72px; height: 80px; position: relative; image-rendering: pixelated; }
  svg.pixel { width: 100%; height: 100%; }

  /* 打字：手臂兩幀 */
  @keyframes typeA { 0%,49% { transform: translateY(0); } 50%,100% { transform: translateY(1px); } }
  .arm-l, .arm-r { transform-origin: top center; }
  .working .arm-l { animation: typeA .32s steps(1) infinite; }
  .working .arm-r { animation: typeA .32s steps(1) infinite reverse; }
  /* 工作中螢幕光 */
  @keyframes glow { 0%,100% { opacity:.25; } 50% { opacity:.55; } }
  .screenlight { opacity:.35; fill:#7dd3fc; }
  .working .screenlight { animation: glow 1.2s ease-in-out infinite; }

  /* 等待：眨眼 */
  @keyframes blink { 0%,92%,100% { transform: scaleY(1);} 95%,97% { transform: scaleY(.1);} }
  .eyes { transform-origin: center; }
  .waiting .eyes { animation: blink 3.5s linear infinite; }

  /* 阻塞：紅色驚嘆號彈跳 */
  @keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-4px);} }
  .alert { opacity: 0; }
  .blocked .alert { opacity: 1; animation: bounce .8s ease-in-out infinite; }
  .blocked .body-tint { fill: #b91c1c; }

  /* 完成：舉手 + 小星星 */
  @keyframes cheer { 0%,100% { transform: rotate(-8deg);} 50% { transform: rotate(8deg);} }
  .arm-r { transform-origin: 60% 10%; }
  .completed .arm-r { animation: cheer .6s ease-in-out infinite; }
  .sparkle { opacity: 0; fill: #fbbf24; }
  @keyframes twinkle { 0%,100%{opacity:.2;} 50%{opacity:1;} }
  .completed .sparkle { animation: twinkle 1s ease-in-out infinite; }
</style>
</head>
<body>
  <h1>🏢 Pixel Agent Demo</h1>
  <p class="sub">每個角色一組調色，狀態驅動動畫：工作中＝打字、等待＝眨眼、阻塞＝冒驚嘆號、完成＝舉手慶祝。點下面的按鈕切換全體狀態～</p>

  <div class="controls">
    <button data-state="idle">閒置</button>
    <button data-state="working" class="active">工作中</button>
    <button data-state="waiting">等待中</button>
    <button data-state="blocked">已阻塞</button>
    <button data-state="reviewing">審查中</button>
    <button data-state="completed">已完成</button>
  </div>

  <div class="office" id="office"></div>

<script>
// 像素圖：16x18 網格，字元對應調色
// . = 透明, H = 髮色, S = 膚色, B = 身體(衣服), L = 腿/褲, E = 眼睛, W = 白(眼白)
const SPRITE = [
  '................',
  '.....HHHHHH.....',
  '....HHHHHHHH....',
  '....HHHHHHHH....',
  '....HSSSSSSH....',
  '....SSEWWEWS....',
  '....SSSSSSSS....',
  '.....SSSSSS.....',
  '......BBBB......',
  '....BBBBBBBB....',
  '...BB.BBBB.BB...',
  '..AA.BBBBBB.AA..',
  '..AA.BBBBBB.AA..',
  '.....BBBBBB.....',
  '.....LL..LL.....',
  '.....LL..LL.....',
  '.....LL..LL.....',
  '....KKK..KKK....'
];
// A = 手臂（單獨 class 以便動畫），E = 眼睛（class eyes）

const ROLES = [
  { id:'ceo',      label:'CEO',           hair:'#3f3f46', skin:'#f2c9a0', shirt:'#8b7cf6', pants:'#312e46' },
  { id:'cto',      label:'CTO',           hair:'#1f2937', skin:'#e8b98a', shirt:'#2563eb', pants:'#1e293b' },
  { id:'product',  label:'產品經理',       hair:'#92400e', skin:'#f5d0aa', shirt:'#059669', pants:'#334155' },
  { id:'designer', label:'UX 設計師',      hair:'#be185d', skin:'#efc094', shirt:'#db2777', pants:'#3b3054' },
  { id:'frontend', label:'前端工程師',     hair:'#b45309', skin:'#f2c9a0', shirt:'#0891b2', pants:'#27303f' },
  { id:'backend',  label:'後端工程師',     hair:'#111827', skin:'#caa06a', shirt:'#65a30d', pants:'#28304a' },
  { id:'qa',       label:'QA 工程師',      hair:'#6d28d9', skin:'#f0c69c', shirt:'#d97706', pants:'#33384d' },
];

function spriteSVG(role) {
  const map = { H: role.hair, S: role.skin, B: role.shirt, L: role.pants, W:'#fff', E:'#18181b', K:'#0f0f12' };
  const px = 4, out = [];
  let arms = [], eyes = [], rest = '';
  SPRITE.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch === '.') return;
      if (ch === 'A') { arms.push([x,y]); return; }
      if (ch === 'E') { eyes.push([x,y]); return; }
      rest += `<rect x="${x*px}" y="${y*px}" width="${px}" height="${px}" fill="${map[ch]}"/>`;
    });
  });
  // 桌面 + 螢幕（工作時發光）
  const desk = `<rect x="8" y="44" width="48" height="4" fill="#3f3f46"/>
    <rect x="26" y="32" width="14" height="11" rx="1" fill="#27272a"/>
    <rect x="28" y="34" width="10" height="7" fill="#7dd3fc" class="screenlight"/>`;
  const armRect = (x,y) => `<rect x="${x*px}" y="${y*px}" width="${px}" height="${px*2.5}" fill="${role.skin}"/>`;
  const eyeRect = (x,y) => `<rect x="${x*px}" y="${y*px}" width="${px}" height="${px}" fill="#18181b"/>`;
  const alert = `<g class="alert"><rect x="58" y="4" width="4" height="12" fill="#ef4444"/><rect x="58" y="20" width="4" height="4" fill="#ef4444"/></g>`;
  const sparkles = `<g class="sparkle"><rect x="4" y="8" width="4" height="4"/><rect x="62" y="40" width="4" height="4"/></g>`;
  return `<svg class="pixel" viewBox="0 0 64 72" shape-rendering="crispEdges">
    ${rest}${desk}
    <g class="arm-l">${armRect(arms[0][0],arms[0][1])}</g>
    <g class="arm-r">${armRect(arms[1][0],arms[1][1])}</g>
    <g class="eyes">${eyes.map(([x,y])=>eyeRect(x,y)).join('')}</g>
    ${alert}${sparkles}
  </svg>`;
}

const office = document.getElementById('office');
for (const r of ROLES) {
  const desk = document.createElement('div');
  desk.className = 'desk working';
  desk.innerHTML = `
    <div class="stage">${spriteSVG(r)}</div>
    <span class="role">${r.label}</span>
    <span class="badge">工作中</span>`;
  office.appendChild(desk);
}

const LABEL = { idle:'閒置', working:'工作中', waiting:'等待中', blocked:'已阻塞', reviewing:'審查中', completed:'已完成' };
document.querySelectorAll('.controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const s = btn.dataset.state;
    document.querySelectorAll('.desk').forEach(d => {
      d.className = 'desk ' + s;
      d.querySelector('.badge').textContent = LABEL[s];
    });
  });
});
</script>
</body>
</html>
